name: Deploy PromptIQ

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build Image
        run: |
          docker build -t asia-south1-docker.pkg.dev/qiscet-smart-connect/promptiq-repo/promptiq .

      - name: Push Image
        run: |
          docker push asia-south1-docker.pkg.dev/qiscet-smart-connect/promptiq-repo/promptiq

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy promptiq \
          --image asia-south1-docker.pkg.dev/qiscet-smart-connect/promptiq-repo/promptiq \
          --platform managed \
          --region asia-south1 \
          --allow-unauthenticated \
          --port 3000
